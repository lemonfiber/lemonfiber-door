# The maintainer queue flag (OPS-R26, OPS-R27). The checks `main` requires:
#
#   gates     gates / gates
#   pin-only  pin-only / pin-only
#   rust      fmt, clippy, test, coverage, deny, msrv
#   image     image / what changed, image / posture
#   codeql    analyze (actions), analyze (rust), alerts / alerts
#   sonar     gate / gate
name: awaiting-maintainer
on:
  workflow_run:
    workflows: [gates, pin-only, rust, image, codeql, sonar]
    types: [completed]
  pull_request_review:
    types: [submitted]
  pull_request_target:
    types: [closed]
permissions:
  contents: read
jobs:
  awaiting:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/awaiting-maintainer.yml@08d30840628cea64ed3a88e477fabebf4d841728 # v1.0.135
    secrets:
      DISCORD_MAINTAINERS_WEBHOOK: ${{ secrets.DISCORD_MAINTAINERS_WEBHOOK }}
