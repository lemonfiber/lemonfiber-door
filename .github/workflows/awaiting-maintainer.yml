# The maintainer queue flag (OPS-R26, OPS-R27). The checks `main` requires:
#
#   gates     gates / gates
#   pin-only  pin-only / pin-only
#   rust      fmt, clippy, test, coverage, deny, msrv
#   image     image / what changed, image / posture
#   codeql    analyze (actions), analyze (rust), alerts / alerts
#   sonar     gate / gate
name: awaiting-maintainer
on:
  workflow_run:
    workflows: [gates, pin-only, rust, image, codeql, sonar]
    types: [completed]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [closed]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  awaiting:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/awaiting-maintainer.yml@0ed88af2df70174392a64a3b8602cbccd6b28101 # v1.0.178
    secrets:
      DISCORD_MAINTAINERS_WEBHOOK: ${{ secrets.DISCORD_MAINTAINERS_WEBHOOK }}
