# The maintainer queue flag (OPS-R26, OPS-R27). The checks `main` requires:
#
#   gates     gates / gates
#   pin-only  pin-only / pin-only
#   image     image / what changed, image / posture
#   codeql    analyze, alerts / alerts
#   sonar     gate / gate
name: awaiting-maintainer
on:
  workflow_run:
    workflows: [gates, pin-only, image, codeql, sonar]
    types: [completed]
  pull_request_review:
    types: [submitted]
  pull_request_target:
    types: [closed]
permissions:
  contents: read
jobs:
  awaiting:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/awaiting-maintainer.yml@a3a5049ee28c2261cc6728db8b48fdf1083b4eca # v1.0.119
    secrets:
      DISCORD_MAINTAINERS_WEBHOOK: ${{ secrets.DISCORD_MAINTAINERS_WEBHOOK }}
