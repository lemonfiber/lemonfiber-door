# The supply-chain posture check (Q-R56, Q-R59), called from spec.
name: scorecard
on:
  workflow_dispatch:
  branch_protection_rule:
  schedule:
    - cron: "26 6 * * 1"
permissions:
  contents: read
jobs:
  scorecard:
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    secrets:
      SCORECARD_TOKEN: ${{ secrets.SCORECARD_TOKEN }}
    uses: lemonfiber/spec/.github/workflows/scorecard.yml@f83b90592c5a03cf179102f3c08ba20b282a6818 # v1.0.143
