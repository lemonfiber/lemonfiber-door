version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Europe/Amsterdam
    labels: ["dependencies"]
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 3
      exclude: ["lemonfiber/spec*"]
    groups:
      shared-workflows:
        patterns: ["lemonfiber/spec*"]
      actions:
        patterns: ["*"]
        exclude-patterns: ["lemonfiber/spec*"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Europe/Amsterdam
    labels: ["dependencies"]
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 3
