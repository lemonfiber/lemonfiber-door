[package]
name = "lemonfiber-door"
version = "0.18.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/lemonfiber/lemonfiber-door"
authors = ["NightWorks.io"]
license-file = "LICENSE"
description = "The guarded door: every byte the media server serves, held to the declaration the core applies"
publish = false

[[bin]]
name = "door"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "http2", "server-auto", "tokio"] }
# The contract it speaks and the kit that serves it, from the core at a pinned commit.
lemonfiber-adapter-kit = { git = "https://github.com/lemonfiber/lemonfiber", rev = "23d16d26f54af845163ff4b004be71bca3972939" }
lemonfiber-contract = { git = "https://github.com/lemonfiber/lemonfiber", rev = "23d16d26f54af845163ff4b004be71bca3972939" }
lemonfiber-ports = { git = "https://github.com/lemonfiber/lemonfiber", rev = "23d16d26f54af845163ff4b004be71bca3972939" }
regex = "1"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
rcgen = "0.14"
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }
duration_suboptimal_units = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
