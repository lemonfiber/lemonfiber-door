# The crate's own code is what SonarCloud's automatic analysis reads as code; its tests
# and the fakes and fixtures they run against are read as tests.
sonar.sources=src
sonar.tests=src
sonar.exclusions=**/tests.rs,src/fake.rs,src/fixtures.rs
sonar.test.inclusions=**/tests.rs,src/fake.rs,src/fixtures.rs
